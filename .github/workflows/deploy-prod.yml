name: Deploy - Produccion (eCF)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # El environment "production" debe configurarse en Settings > Environments
    # con "Required reviewers" para exigir aprobacion manual antes de publicar
    # comprobantes contra el ambiente eCF (validez fiscal real).
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        modulo: [autenticacion]
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen (ambiente produccion) - ${{ matrix.modulo }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.modulo }}/Dockerfile
          push: true
          build-args: |
            APP_ENV=production
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.modulo }}:prod-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.modulo }}:prod-latest

      # Paso de despliegue especifico de infraestructura (SSH, Kubernetes,
      # Cloud Run, etc.). Placeholder hasta definir el destino de produccion;
      # usar los secretos del environment "production" configurados en
      # Settings > Environments > production (EMISOR_RNC, CERTIFICADO_PASSWORD, etc.).
      - name: Deploy al servidor de produccion - ${{ matrix.modulo }}
        run: |
          echo "TODO: definir pasos de despliegue del ambiente de produccion para ${{ matrix.modulo }}"
