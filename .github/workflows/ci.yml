name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, qa]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest --cov=libs --cov=services --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        modulo:
          - autenticacion
          - recepcion
          - recepcion_rfce
          - consulta_rfce
          - consulta_resultado
          - consulta_estado
          - consulta_trackids
          - aprobacion_comercial
          - anulacion_encf
          - consulta_directorio
          - consulta_timbre
          - facturas_api
          - inventario_api
          - receptor_autenticacion
          - receptor_recepcion
          - receptor_aprobacion_comercial
          - formato_606
          - erp_api
    steps:
      - uses: actions/checkout@v7

      - name: Build de imagen Docker (validacion) - ${{ matrix.modulo }}
        run: |
          docker build --build-arg APP_ENV=test \
            -f services/${{ matrix.modulo }}/Dockerfile \
            -t facturacion-electronica/${{ matrix.modulo }}:ci .

  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

  frontend-docker-build:
    runs-on: ubuntu-latest
    needs: frontend-lint-test
    steps:
      - uses: actions/checkout@v7

      - name: Build de imagen Docker (validacion) - frontend
        run: |
          docker build --build-arg VITE_API_URL=http://localhost:8011 \
            -f frontend/Dockerfile \
            -t facturacion-electronica/frontend:ci ./frontend
