name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, qa]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest --cov=libs --cov=services --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        modulo:
          - autenticacion
          - recepcion
          - recepcion_rfce
          - consulta_rfce
          - consulta_resultado
          - consulta_estado
          - consulta_trackids
          - aprobacion_comercial
          - anulacion_encf
          - consulta_directorio
          - consulta_timbre
    steps:
      - uses: actions/checkout@v4

      - name: Build de imagen Docker (validacion) - ${{ matrix.modulo }}
        run: |
          docker build --build-arg APP_ENV=test \
            -f services/${{ matrix.modulo }}/Dockerfile \
            -t facturacion-electronica/${{ matrix.modulo }}:ci .
