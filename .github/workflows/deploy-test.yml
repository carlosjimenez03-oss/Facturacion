name: Deploy - Test (TesteCF)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        modulo:
          - autenticacion
          - recepcion
          - recepcion_rfce
          - consulta_rfce
          - consulta_resultado
          - consulta_estado
          - consulta_trackids
          - aprobacion_comercial
          - anulacion_encf
          - consulta_directorio
          - consulta_timbre
          - facturas_api
    steps:
      - uses: actions/checkout@v4

      # Los nombres de repositorio en un registro OCI/Docker deben ser en
      # minusculas; github.repository conserva las mayusculas del nombre
      # real del repo (Facturacion-electronica), por lo que hay que
      # normalizarlo antes de usarlo en un tag de imagen.
      - name: Normalizar nombre de imagen a minusculas
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen (ambiente test) - ${{ matrix.modulo }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.modulo }}/Dockerfile
          push: true
          build-args: |
            APP_ENV=test
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.modulo }}:test-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.modulo }}:test-latest

      # Paso de despliegue especifico de infraestructura (SSH, Kubernetes,
      # Cloud Run, etc.). Placeholder hasta definir el destino del ambiente
      # de test; usar los secretos del environment "test" configurados en
      # Settings > Environments > test.
      - name: Deploy al servidor de pruebas - ${{ matrix.modulo }}
        run: |
          echo "TODO: definir pasos de despliegue del ambiente de test para ${{ matrix.modulo }}"

  frontend-build-and-push:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nombre de imagen a minusculas
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_API_URL debe ser la URL PUBLICA de facturas-api en este ambiente
      # (se hornea en el bundle en build time). Configurar como variable del
      # environment "test" en Settings > Environments > test > Variables.
      - name: Build y push de imagen (ambiente test) - frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:test-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:test-latest

      - name: Deploy al servidor de pruebas - frontend
        run: |
          echo "TODO: definir pasos de despliegue del ambiente de test para frontend"
