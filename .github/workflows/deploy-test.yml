name: Deploy - Test (TesteCF)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen (ambiente test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=test
          tags: ghcr.io/${{ github.repository }}:test-${{ github.sha }},ghcr.io/${{ github.repository }}:test-latest

      # Paso de despliegue especifico de infraestructura (SSH, Kubernetes,
      # Cloud Run, etc.). Placeholder hasta definir el destino del ambiente
      # de test; usar los secretos del environment "test" configurados en
      # Settings > Environments > test.
      - name: Deploy al servidor de pruebas
        run: |
          echo "TODO: definir pasos de despliegue del ambiente de test"
