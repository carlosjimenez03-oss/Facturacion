name: Deploy - QA (CerteCF)

on:
  push:
    branches: [qa]

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        modulo:
          - autenticacion
          - recepcion
          - recepcion_rfce
          - consulta_rfce
          - consulta_resultado
          - consulta_estado
          - consulta_trackids
          - aprobacion_comercial
          - anulacion_encf
          - consulta_directorio
          - consulta_timbre
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen (ambiente QA) - ${{ matrix.modulo }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.modulo }}/Dockerfile
          push: true
          build-args: |
            APP_ENV=qa
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.modulo }}:qa-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.modulo }}:qa-latest

      # Paso de despliegue especifico de infraestructura (SSH, Kubernetes,
      # Cloud Run, etc.). Placeholder hasta definir el destino del ambiente
      # de QA; usar los secretos del environment "qa" configurados en
      # Settings > Environments > qa (EMISOR_RNC, CERTIFICADO_PASSWORD, etc.).
      - name: Deploy al servidor de QA - ${{ matrix.modulo }}
        run: |
          echo "TODO: definir pasos de despliegue del ambiente de QA para ${{ matrix.modulo }}"
