name: Deploy - QA (CerteCF)

on:
  push:
    branches: [qa]

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de imagen (ambiente QA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=qa
          tags: ghcr.io/${{ github.repository }}:qa-${{ github.sha }},ghcr.io/${{ github.repository }}:qa-latest

      # Paso de despliegue especifico de infraestructura (SSH, Kubernetes,
      # Cloud Run, etc.). Placeholder hasta definir el destino del ambiente
      # de QA; usar los secretos del environment "qa" configurados en
      # Settings > Environments > qa (EMISOR_RNC, DGII_API_USER,
      # DGII_API_PASSWORD, CERTIFICADO_PASSWORD, POSTGRES_PASSWORD, etc.).
      - name: Deploy al servidor de QA
        run: |
