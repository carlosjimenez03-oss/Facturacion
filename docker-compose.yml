# Configuracion base compartida por los tres ambientes. Combinar siempre con
# el override correspondiente, por ejemplo:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# Cada módulo de facturación electrónica (services/<modulo>) es un servicio
# Docker independiente que comparte libs/ecf_common. Para agregar un nuevo
# módulo: crear services/<modulo>/{app,Dockerfile}, agregar el bloque aquí
# (siguiendo el mismo patrón) y sumarlo a la matriz `modulo` de los 4
# workflows en .github/workflows/.
x-comun: &comun
  restart: unless-stopped
  volumes:
    - ./certs:/app/certs:ro

services:
  autenticacion:
    <<: *comun
    build:
      context: .
      dockerfile: services/autenticacion/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-test}
    image: facturacion-electronica/autenticacion:${APP_ENV:-test}

  recepcion:
    <<: *comun
    build:
      context: .
      dockerfile: services/recepcion/Dockerfile
