# Ambiente de PRODUCCION. DGII: eCF (comprobantes con validez fiscal real).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Los secretos reales se inyectan desde el gestor de secretos del entorno de
# despliegue; nunca se commitean en .env.production. El certificado .p12 se
# monta como volumen (./certs), nunca se incluye en la imagen.
x-prod-comun: &prod-comun
  env_file:
    - .env.production
  environment:
    APP_ENV: production
  deploy:
    restart_policy:
      condition: on-failure
      max_attempts: 5

services:
  autenticacion:
    <<: *prod-comun
    ports: ["8000:8000"]
  recepcion:
    <<: *prod-comun
    ports: ["8001:8000"]
  recepcion-rfce:
    <<: *prod-comun
    ports: ["8002:8000"]
  consulta-rfce:
    <<: *prod-comun
    ports: ["8003:8000"]
  consulta-resultado:
    <<: *prod-comun
    ports: ["8004:8000"]
  consulta-estado:
    <<: *prod-comun
    ports: ["8005:8000"]
  consulta-trackids:
    <<: *prod-comun
    ports: ["8006:8000"]
  aprobacion-comercial:
    <<: *prod-comun
    ports: ["8007:8000"]
  anulacion-encf:
    <<: *prod-comun
    ports: ["8008:8000"]
  consulta-directorio:
    <<: *prod-comun
    ports: ["8009:8000"]
  consulta-timbre:
    <<: *prod-comun
    ports: ["8010:8000"]
  facturas-api:
    <<: *prod-comun
    ports: ["8011:8000"]
  inventario-api:
    <<: *prod-comun
    ports: ["8012:8000"]
  receptor-autenticacion:
    <<: *prod-comun
    ports: ["8013:8000"]
  receptor-recepcion:
    <<: *prod-comun
    ports: ["8014:8000"]
  receptor-aprobacion-comercial:
    <<: *prod-comun
    ports: ["8015:8000"]
  frontend:
    ports: ["5173:80"]
