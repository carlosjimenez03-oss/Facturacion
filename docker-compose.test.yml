# Ambiente de PRUEBAS (local/dev). DGII: TesteCF.
# Uso: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build
x-test-comun: &test-comun
  env_file:
    - .env.test
  environment:
    APP_ENV: test
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

services:
  autenticacion:
    <<: *test-comun
    volumes:
      - ./services/autenticacion/app:/app/app:ro
      - ./libs:/app/libs:ro
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"

