# Ambiente de QA / CERTIFICACION. DGII: CerteCF.
# Uso: docker compose -f docker-compose.yml -f docker-compose.qa.yml up --build -d
services:
  autenticacion:
    build:
      args:
        APP_ENV: qa
    env_file:
      - .env.qa
    environment:
      APP_ENV: qa
      # Los secretos reales (EMISOR_RNC, CERTIFICADO_PASSWORD, etc.) se
      # inyectan desde el entorno del runner de CI/CD o del orquestador,
      # sobreescribiendo el .env.qa. El certificado .p12 se monta como
      # volumen (./certs), nunca se incluye en la imagen.
    ports:
      - "8001:8000"
