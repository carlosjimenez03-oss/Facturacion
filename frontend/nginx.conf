# Inicio de sesión: máximo 10 intentos por minuto por IP (con ráfagas de 5)
# contra /auth/v1/token -- ver la location de abajo. La IP es la del cliente
# real (CF-Connecting-IP del túnel de Cloudflare, ver ip_real.conf).
limit_req_zone $binary_remote_addr zone=kontara_login:10m rate=10r/m;
# Pago con tarjeta en línea desde el portal público (fase 7): máximo 10
# intentos de pago nuevos por minuto por IP (ráfagas de 5) contra
# POST /api-erp/portal/publico/<token>/pagos. erp-api además limita los
# intentos por enlace y hora (docs/PAGOS.md).
limit_req_zone $binary_remote_addr zone=kontara_pagos:10m rate=10r/m;

# Cuerpo del 401 de auth_request según el motivo que manda erp-api en
# X-Kontara-Motivo (un código fijo; ver sesion.conf y @kontara_sin_sesion).
map $kontara_motivo $kontara_detalle_401 {
    sin_acceso     '{"detail":"Su usuario no tiene acceso a Kontara: pida a un administrador que se lo dé en Configuración → Usuarios"}';
    sesion_cerrada '{"detail":"La sesión se cerró: inicie sesión de nuevo"}';
    default        '{"detail":"Inicie sesión para continuar"}';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy same-origin a facturas-api por la red interna de Docker (nombre
    # de servicio del compose) -- evita exponer facturas-api públicamente
    # (con su propio dominio/puerto) y el problema de "mixed content" de
    # llamar a un backend http:// desde un frontend https://. Ver
    # frontend/src/lib/api.ts (VITE_API_URL=/api) y docs/DOKPLOY.md.
    #
    # IMPORTANTE: `proxy_pass` con un hostname LITERAL (sin variable) resuelve
    # el DNS UNA sola vez, al arrancar/recargar nginx, y cachea esa IP para
    # siempre. Si el contenedor de facturas-api cambia de IP en la red interna
    # (redeploy, reinicio, reconexión de red) sin que nginx se reinicie,
    # nginx sigue intentando conectar a la IP vieja y devuelve 502
    # "connect() failed (111: Connection refused)" -- visto en producción.
    # Usar una variable en `proxy_pass` fuerza a nginx a resolver por
    # request (con el `resolver` de Docker, cacheado solo `valid` segundos),
    # así siempre usa la IP actual de facturas-api sin importar qué le pase
    # a su IP entre un request y otro. Con una variable, nginx ya NO recorta
    # automáticamente el prefijo de la location del URI -- por eso el
    # `rewrite` explícito para quitar `/api/` antes de reenviar.
    #
    # OJO con el orden: `set` y `rewrite` son ambos del módulo rewrite de
    # nginx, ejecutados en el orden en que aparecen -- el flag `break` de
    # `rewrite` corta el procesamiento de TODAS las directivas del módulo
    # rewrite que sigan en el bloque, incluyendo un `set` posterior. Por eso
    # `set` va ANTES del `rewrite ... break`, si no la variable queda sin
    # inicializar ("using uninitialized variable" / 500 en vez de proxyear).
    resolver 127.0.0.11 valid=10s;

    # XML de e-CF, certificados .p12 y logos: más que el 1 MB por defecto.
    client_max_body_size 10m;

    # IP real del cliente: el túnel de Cloudflare la manda en
    # CF-Connecting-IP. Solo se cree esa cabecera si el request llega desde
    # un proxy de confianza (KONTARA_PROXY_CONFIABLE, por defecto loopback y
    # las redes privadas de Docker: cloudflared corre en el host y entra por
    # el puerto publicado). La genera docker/40-kontara-sesion.sh.
    include /etc/nginx/kontara/ip_real.conf;

    # Lo llena `auth_request_set` (sesion.conf) con X-Kontara-Motivo de erp-api.
    set $kontara_motivo "";

    # Cada location que reenvía a un servicio interno BORRA la cabecera
    # X-Kontara-Interno (`proxy_set_header X-Kontara-Interno "";`): es el
    # secreto de las llamadas internas entre servicios (KONTARA_TOKEN_INTERNO,
    # pasa el REQUIRE_AUTH sin sesión) y el navegador no debe poder mandarla.

    # --- Sesión (Supabase Auth), ver docs/AUTH.md ---
    #
    # Cada `location /api*` incluye /etc/nginx/kontara/sesion.conf, que el
    # script docker/40-kontara-sesion.sh genera al arrancar el contenedor:
    # con KONTARA_AUTH (se enciende sola cuando existe SUPABASE_JWT_SECRET,
    # ver docker-compose.dokploy.yml) contiene `auth_request` hacia
    # /_kontara/verificar; sin ella queda vacío y la aplicación sigue abierta
    # como antes (para no dejar a nadie fuera mientras se configura).
    #
    # /_kontara/verificar le pregunta a erp-api (GET /auth/verificar) si el
    # `Authorization: Bearer` (o la cookie kontara_sesion de los enlaces
    # directos, p. ej. el PDF) es un access_token vigente de Supabase Auth.
    # Solo reenvía cabeceras (sin el cuerpo) y no se cachea nada.
    location = /_kontara/verificar {
        internal;
        set $erp_api_upstream http://erp-api:8000;
        rewrite ^ /auth/verificar break;
        proxy_pass $erp_api_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Método y ruta del request original: erp-api solo acepta la cookie
        # kontara_sesion en GET/HEAD de las descargas (PDF, XML); para todo lo
        # demás exige Authorization (CSRF).
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Kontara-Interno "";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 401 de auth_request: JSON (lo leen los clientes de src/lib/*Api.ts) en
    # vez de la página HTML de nginx, con el motivo de erp-api si lo dio
    # (usuario sin acceso a Kontara, sesión cerrada; map de arriba). Los 401 que devuelvan las propias APIs
    # pasan tal cual (proxy_intercept_errors está apagado). La cabecera
    # `WWW-Authenticate: Bearer` la copia nginx sola desde la respuesta de
    # erp-api.
    location @kontara_sin_sesion {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 $kontara_detalle_401;
    }

    # Supabase Auth (GoTrue) en el mismo origen que el frontend: el
    # navegador llama /auth/v1/token, /auth/v1/recover, /auth/v1/user... aquí
    # y nginx lo reenvía al gateway del recurso de Supabase (`api-gw`) por la
    # red interna `supabase` (el frontend se une a ella en el compose).
    # El gateway exige la `apikey` (ANON_KEY) que manda el frontend.
    #
    # Solo pasan las rutas que usa el frontend (lista cerrada, src/lib/
    # sesion.ts): /token, /logout, /recover, /user, /verify, /health y
    # /settings. Todo lo demás -- /signup, /otp, /magiclink, /sso, /factors,
    # /invite, /admin/* (la API admin solo la usa erp-api por la red
    # interna)... -- responde 403 aquí, aunque GoTrue lo tenga encendido.
    # Se reenvía `$uri` (ya normalizado por nginx: sin `..` ni %2F) y no el
    # URI crudo del navegador.
    location ^~ /auth/v1/admin {
        default_type application/json;
        return 403 '{"msg":"Ruta de Supabase Auth no disponible"}';
    }

    # Inicio de sesión y renovación del token: con límite de intentos por IP
    # (429 al pasarse, ver limit_req_zone arriba).
    location = /auth/v1/token {
        limit_req zone=kontara_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/kontara/supabase.conf;
        proxy_pass $supabase_gateway$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Kontara-Interno "";
    }

    location ~ ^/auth/v1/(logout|recover|user|verify|health|settings)$ {
        include /etc/nginx/kontara/supabase.conf;
        proxy_pass $supabase_gateway$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Kontara-Interno "";
    }

    location /auth/v1/ {
        default_type application/json;
        return 403 '{"msg":"Ruta de Supabase Auth no disponible"}';
    }

    # --- Receptor electrónico (PÚBLICO, sin sesión) ---
    #
    # La DGII y los otros contribuyentes llaman estas rutas (estándar de
    # Receptor Electrónico): nunca llevan auth_request. Opcional: permite
    # publicar el receptor por el mismo dominio del frontend
    # (https://<dominio>/fe/...), ver docs/AUTH.md, "Puertos". Se reenvía
    # `$uri` (normalizado) y no el URI crudo del request.
    location /fe/autenticacion/ {
        set $receptor_autenticacion_upstream http://receptor-autenticacion:8000;
        proxy_pass $receptor_autenticacion_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    location /fe/recepcion/ {
        set $receptor_recepcion_upstream http://receptor-recepcion:8000;
        proxy_pass $receptor_recepcion_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    location /fe/aprobacioncomercial/ {
        set $receptor_aprobacion_upstream http://receptor-aprobacion-comercial:8000;
        proxy_pass $receptor_aprobacion_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    location /api/ {
        include /etc/nginx/kontara/sesion.conf;
        set $facturas_api_upstream http://facturas-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $facturas_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Mismo mecanismo que /api/ de arriba (variable + resolver + rewrite con
    # el `set` ANTES del `rewrite ... break`), pero hacia inventario-api. Ver
    # frontend/src/lib/inventarioApi.ts (VITE_INVENTARIO_API_URL=/api-inventario).
    location /api-inventario/ {
        include /etc/nginx/kontara/sesion.conf;
        set $inventario_api_upstream http://inventario-api:8000;
        rewrite ^/api-inventario/(.*)$ /$1 break;
        proxy_pass $inventario_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Mismo mecanismo que /api/ de arriba (variable + resolver + rewrite con
    # el `set` ANTES del `rewrite ... break`), pero hacia formato-606. Ver
    # frontend/src/lib/formato606Api.ts (VITE_FORMATO_606_API_URL=/api-606).
    location /api-606/ {
        include /etc/nginx/kontara/sesion.conf;
        set $formato_606_upstream http://formato-606:8000;
        rewrite ^/api-606/(.*)$ /$1 break;
        proxy_pass $formato_606_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Mismo mecanismo que /api/ de arriba (variable + resolver + rewrite con
    # el `set` ANTES del `rewrite ... break`), pero hacia erp-api. Ver
    # frontend/src/lib/erpApi.ts (VITE_ERP_API_URL=/api-erp).
    location /api-erp/ {
        include /etc/nginx/kontara/sesion.conf;
        set $erp_api_upstream http://erp-api:8000;
        rewrite ^/api-erp/(.*)$ /$1 break;
        proxy_pass $erp_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Portal de clientes PÚBLICO (Soluciones, frontend /p/<token>): el cliente
    # abre su enlace sin iniciar sesión, así que esta location NO incluye
    # sesion.conf -- lo protege el token del enlace (erp-api solo guarda su
    # hash, y lo revoca o lo deja vencer). Es más específica que /api-erp/,
    # así que nginx la elige solo para /api-erp/portal/publico/...; el resto
    # de /api-erp/portal/* (crear o revocar enlaces) sigue pidiendo sesión.
    # erp-api con REQUIRE_AUTH también deja pasar esta ruta (main.py).
    # Referrer-Policy: el token va en la URL; que el navegador no lo mande
    # como Referer a otros sitios (p. ej. al abrir un enlace del portal).
    location /api-erp/portal/publico/ {
        add_header Referrer-Policy "no-referrer" always;
        set $erp_api_upstream http://erp-api:8000;
        rewrite ^/api-erp/(.*)$ /$1 break;
        proxy_pass $erp_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Iniciar un pago con tarjeta desde el portal público (fase 7): la misma
    # location pública de arriba, con límite de intentos por IP. Es una regex,
    # así que nginx la prefiere a la de prefijo /api-erp/portal/publico/.
    # X-Forwarded-Host (con puerto): sin PAGOS_URL_PUBLICA (fuera de
    # producción) erp-api arma con él las URL de retorno del banco.
    location ~ ^/api-erp/portal/publico/[^/]+/pagos$ {
        limit_req zone=kontara_pagos burst=5 nodelay;
        limit_req_status 429;
        add_header Referrer-Policy "no-referrer" always;
        set $erp_api_upstream http://erp-api:8000;
        rewrite ^/api-erp/(.*)$ /$1 break;
        proxy_pass $erp_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kontara-Interno "";
    }

    # Página pública del portal de clientes (/p/<token>): misma razón. Sirve
    # index.html aquí mismo (try_files con el archivo, no como último
    # recurso): una redirección interna a `location /` perdería la cabecera.
    location /p/ {
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # Service worker del POS sin conexión (vite-plugin-pwa, ver
    # vite.config.ts): sin caché HTTP, para que el navegador vea cada
    # despliegue nuevo en la siguiente carga.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
