server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy same-origin a facturas-api por la red interna de Docker (nombre
    # de servicio del compose) -- evita exponer facturas-api públicamente
    # (con su propio dominio/puerto) y el problema de "mixed content" de
    # llamar a un backend http:// desde un frontend https://. Ver
    # frontend/src/lib/api.ts (VITE_API_URL=/api) y docs/DOKPLOY.md.
    location /api/ {
        proxy_pass http://facturas-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
