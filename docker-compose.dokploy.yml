# Despliegue único para Dokploy: los 11 módulos de facturación electrónica +
# facturas-api + inventario-api + los 3 módulos de Receptor Electrónico +
# formato-606 + erp-api + frontend, en un solo archivo (sin
# encadenar -f -f como en docker-compose.yml + overrides, pensado para
# desarrollo local).
#
# Puertos de host 8001-8019 (no 8000-8018): se corrieron todos +1 porque en
# despliegues reales del servidor Dokploy es común que el puerto 8000 ya
# esté tomado por otro servicio del mismo host. Ver docs/DOKPLOY.md.
#
# Uso en Dokploy: crear un recurso tipo "Compose", apuntarlo a este
# repositorio y configurar "Compose Path" = docker-compose.dokploy.yml.
#
# Todas las variables (${...}) se configuran como Environment Variables del
# proyecto en el panel de Dokploy — NUNCA se commitean aquí. Ver
# docs/DOKPLOY.md para la lista completa y el paso manual de subir el
# certificado .p12 del emisor (no se puede commitear).
x-modulo-env: &modulo-env
  APP_ENV: ${APP_ENV:-production}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  EMISOR_RNC: ${EMISOR_RNC:?EMISOR_RNC es requerido}
  CERTIFICADO_PATH: /app/certs/emisor.p12
  CERTIFICADO_PASSWORD: ${CERTIFICADO_PASSWORD:?CERTIFICADO_PASSWORD es requerido}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["*"]}
  # Base de datos: Postgres de Supabase (self-hosted en Dokploy). Cadena de
  # conexión del pooler Supavisor por la red interna `supabase` -- ver
  # docs/SUPABASE.md. Ejemplo (modo sesión):
  # postgresql://postgres.<POOLER_TENANT_ID>:<POSTGRES_PASSWORD>@supavisor:5432/postgres
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es requerido (Postgres de Supabase, ver docs/SUPABASE.md)}

x-modulo-comun: &modulo-comun
  restart: unless-stopped
  environment: *modulo-env
  volumes:
    - ./certs:/app/certs:ro
  # `supabase`: red interna del recurso de Supabase en Dokploy, para llegar
  # al pooler (`supavisor`) por nombre sin publicar el 5432 en el servidor.
  networks: [facturacion, supabase]

services:
  # --- Base de datos ---
  #
  # La base de datos vive en Supabase (self-hosted, recurso aparte en
  # Dokploy): Postgres + Supabase Studio para ver y editar las tablas. Ya no
  # se levantan aquí postgres, postgrest ni pgadmin. Ver docs/SUPABASE.md
  # (instalación, migración de datos y acceso a Studio).

  # --- Módulos de facturación electrónica (uno por servicio DGII) ---

  autenticacion:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/autenticacion/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8001:8000"]

  recepcion:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/recepcion/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8002:8000"]

  recepcion-rfce:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/recepcion_rfce/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8003:8000"]

  consulta-rfce:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_rfce/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8004:8000"]

  consulta-resultado:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_resultado/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8005:8000"]

  consulta-estado:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_estado/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8006:8000"]

  consulta-trackids:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_trackids/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8007:8000"]

  aprobacion-comercial:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/aprobacion_comercial/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8008:8000"]

  anulacion-encf:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/anulacion_encf/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8009:8000"]

  consulta-directorio:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_directorio/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8010:8000"]

  consulta-timbre:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/consulta_timbre/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8011:8000"]

  facturas-api:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/facturas_api/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8012:8000"]

  # --- Inventario (catálogo, compras, kardex) ---
  #
  # facturas-api le habla por la red interna (http://inventario-api:8000,
  # ver services/facturas_api/app/config.py) para validar disponibilidad de
  # stock antes de enviar una factura a la DGII y para registrar la salida
  # de mercancía después de un envío exitoso -- igual que ya hace con
  # `recepcion`. No necesita Domain propio en Dokploy por la misma razón
  # documentada para facturas-api (ver la nota IMPORTANTE más abajo).
  inventario-api:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/inventario_api/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8014:8000"]

  # --- Receptor Electrónico (autenticación, recepción, aprobación comercial) ---
  #
  # A diferencia de facturas-api/inventario-api, estos SÍ deben ser
  # alcanzables por otros contribuyentes desde Internet (así lo exige el
  # estándar: SSL, "puertos de red tradicionales" -- ver
  # docs/dgii/EMISORES_ELECTRONICOS.md). Publican su puerto al host
  # (ports, igual que los demás módulos DGII) para poder alcanzarlos por
  # IP:puerto directo o vía un reverse proxy externo -- ver la nota
  # IMPORTANTE sobre exposición pública en docs/DOKPLOY.md antes de
  # asignarles un Domain de Dokploy (mismo riesgo de red ya documentado
  # para facturas-api).
  receptor-autenticacion:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/receptor_autenticacion/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8015:8000"]

  receptor-recepcion:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/receptor_recepcion/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8016:8000"]

  receptor-aprobacion-comercial:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/receptor_aprobacion_comercial/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8017:8000"]

  # --- Formato 606 (Compras de Bienes y Servicios) ---
  #
  # Igual que facturas-api/inventario-api: solo se consume internamente vía
  # el frontend (proxy nginx /api-606), no necesita ser alcanzable desde
  # Internet ni tener un Domain de Dokploy propio.
  formato-606:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/formato_606/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8018:8000"]

  # --- ERP de ventas (contactos, cotizaciones, cobros, cuentas por cobrar) ---
  #
  # Igual que facturas-api/inventario-api: solo lo consume el frontend
  # (proxy nginx /api-erp), sin Domain propio. Crea su esquema `ventas` por
  # sí mismo al arrancar (en Supabase nadie corre db/init) y solo LEE
  # facturacion.facturas para las cuentas por cobrar. Ver docs/ERP_API.md.
  erp-api:
    <<: *modulo-comun
    build:
      context: .
      dockerfile: services/erp_api/Dockerfile
      args: {APP_ENV: "${APP_ENV:-production}"}
    ports: ["8019:8000"]
    # El <<: de arriba no fusiona `environment` en profundidad: se repite el
    # ancla y se agrega EMISOR_100_ELECTRONICO (true = no presenta 607/608
    # por emitir solo e-CF; ponga false si todavía emite NCF serie B).
    # Compras: APROBACION_COMERCIAL_URL es el módulo que firma y envía a la
    # DGII la aprobación/rechazo comercial de la bandeja de entrada (red
    # interna); EMISOR_RAZON_SOCIAL sale en los certificados de retención.
    environment:
      <<: *modulo-env
      EMISOR_100_ELECTRONICO: ${EMISOR_100_ELECTRONICO:-true}
      APROBACION_COMERCIAL_URL: ${APROBACION_COMERCIAL_URL:-http://aprobacion-comercial:8000}
      EMISOR_RAZON_SOCIAL: ${EMISOR_RAZON_SOCIAL:-}

  # --- Frontend (React) ---

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_API_URL/VITE_INVENTARIO_API_URL/VITE_FORMATO_606_API_URL/
      # VITE_ERP_API_URL se hornean en el bundle en build time. Default
      # "/api", "/api-inventario", "/api-606" y "/api-erp": nginx
      # (frontend/nginx.conf) reenvía cada una a
      # facturas-api/inventario-api/formato-606/erp-api por la red interna
      # `facturacion` (mismo origen que el frontend -- evita CORS y el
      # problema de "mixed content" al llamar un backend http:// desde un
      # frontend https://). No hace falta exponer ninguno de estos servicios
      # públicamente ni asignarles un dominio propio. Ver docs/DOKPLOY.md.
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_INVENTARIO_API_URL: "${VITE_INVENTARIO_API_URL:-/api-inventario}"
        VITE_FORMATO_606_API_URL: "${VITE_FORMATO_606_API_URL:-/api-606}"
        VITE_ERP_API_URL: "${VITE_ERP_API_URL:-/api-erp}"
        # Identidad visual del frontend (opcional, ver docs/DOKPLOY.md).
        VITE_MARCA: "${VITE_MARCA:-}"
        VITE_EMPRESA_NOMBRE: "${VITE_EMPRESA_NOMBRE:-}"
        VITE_EMPRESA_RNC: "${VITE_EMPRESA_RNC:-}"
    ports: ["8013:80"]
    networks: [facturacion]

networks:
  facturacion:
  # Red creada por el recurso de Supabase (se ve con `docker network ls`, por
  # ejemplo facturacion-supabase-soscqp_default). Ver docs/SUPABASE.md, paso 2.
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?SUPABASE_NETWORK es requerido (red de Docker del recurso de Supabase, ver docs/SUPABASE.md)}
